<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">每个合格结果的总成本</title>
  <desc id="desc">模型费用、重试费用、人工复核返工成本相加，除以合格结果数。</desc>
  <rect width="1200" height="560" fill="#f7f9fb"/>
  <text x="72" y="85" fill="#172333" font-family="Microsoft YaHei, sans-serif" font-size="38" font-weight="700">别只比 Token 单价</text>
  <text x="72" y="125" fill="#536172" font-family="Microsoft YaHei, sans-serif" font-size="21">真正要算的是交付一个可用结果花了多少</text>

  <rect x="72" y="185" width="300" height="126" rx="7" fill="#ffffff" stroke="#cbd4de" stroke-width="2"/>
  <rect x="450" y="185" width="300" height="126" rx="7" fill="#ffffff" stroke="#cbd4de" stroke-width="2"/>
  <rect x="828" y="185" width="300" height="126" rx="7" fill="#ffffff" stroke="#cbd4de" stroke-width="2"/>
  <text x="222" y="239" text-anchor="middle" fill="#0f766e" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700">模型费用</text>
  <text x="222" y="278" text-anchor="middle" fill="#536172" font-family="Microsoft YaHei, sans-serif" font-size="20">输入、输出与推理</text>
  <text x="600" y="239" text-anchor="middle" fill="#b45309" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700">重试费用</text>
  <text x="600" y="278" text-anchor="middle" fill="#536172" font-family="Microsoft YaHei, sans-serif" font-size="20">失败、超时与重复调用</text>
  <text x="978" y="239" text-anchor="middle" fill="#b42358" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="700">人工成本</text>
  <text x="978" y="278" text-anchor="middle" fill="#536172" font-family="Microsoft YaHei, sans-serif" font-size="20">复核、修复与返工</text>
  <text x="411" y="261" text-anchor="middle" fill="#64748b" font-family="Microsoft YaHei, sans-serif" font-size="38">+</text>
  <text x="789" y="261" text-anchor="middle" fill="#64748b" font-family="Microsoft YaHei, sans-serif" font-size="38">+</text>

  <path d="M600 323 V358" fill="none" stroke="#64748b" stroke-width="4"/>
  <path d="M590 354 L600 371 L610 354" fill="#64748b"/>
  <rect x="72" y="384" width="1056" height="104" rx="7" fill="#172333"/>
  <text x="600" y="448" text-anchor="middle" fill="#ffffff" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700">每个合格结果的总成本 = 以上费用之和 ÷ 合格结果数</text>
</svg>

