<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">开发者选型的两层结构</title>
  <desc id="desc">先确定任务和工作方式，再选择底层模型，最后根据真实结果验收。</desc>
  <rect width="1200" height="650" fill="#f7f9fb"/>
  <text x="72" y="86" fill="#172333" font-family="Microsoft YaHei, sans-serif" font-size="38" font-weight="700">选型先分两层，再看交付结果</text>
  <text x="72" y="128" fill="#536172" font-family="Microsoft YaHei, sans-serif" font-size="21">工具决定能做什么；模型影响如何完成任务</text>

  <rect x="72" y="190" width="300" height="268" rx="7" fill="#ffffff" stroke="#cbd4de" stroke-width="2"/>
  <rect x="72" y="190" width="300" height="10" fill="#0f766e"/>
  <text x="104" y="253" fill="#0f766e" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700">01 任务</text>
  <text x="104" y="309" fill="#172333" font-family="Microsoft YaHei, sans-serif" font-size="25">工程开发</text>
  <text x="104" y="348" fill="#172333" font-family="Microsoft YaHei, sans-serif" font-size="25">批量处理</text>
  <text x="104" y="387" fill="#172333" font-family="Microsoft YaHei, sans-serif" font-size="25">长文档分析</text>

  <path d="M392 324 H446" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M443 314 L461 324 L443 334" fill="#64748b"/>

  <rect x="460" y="190" width="300" height="268" rx="7" fill="#ffffff" stroke="#cbd4de" stroke-width="2"/>
  <rect x="460" y="190" width="300" height="10" fill="#b45309"/>
  <text x="492" y="253" fill="#b45309" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700">02 工作方式</text>
  <text x="492" y="309" fill="#172333" font-family="Microsoft YaHei, sans-serif" font-size="25">编码 Agent</text>
  <text x="492" y="348" fill="#172333" font-family="Microsoft YaHei, sans-serif" font-size="25">API 流水线</text>
  <text x="492" y="387" fill="#172333" font-family="Microsoft YaHei, sans-serif" font-size="25">检索与审阅</text>

  <path d="M780 324 H834" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <path d="M831 314 L849 324 L831 334" fill="#64748b"/>

  <rect x="848" y="190" width="280" height="268" rx="7" fill="#ffffff" stroke="#cbd4de" stroke-width="2"/>
  <rect x="848" y="190" width="280" height="10" fill="#b42358"/>
  <text x="880" y="253" fill="#b42358" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700">03 模型</text>
  <text x="880" y="309" fill="#172333" font-family="Microsoft YaHei, sans-serif" font-size="25">Claude / GPT</text>
  <text x="880" y="348" fill="#172333" font-family="Microsoft YaHei, sans-serif" font-size="25">DeepSeek / Kimi</text>
  <text x="880" y="387" fill="#172333" font-family="Microsoft YaHei, sans-serif" font-size="25">按结果选用</text>

  <rect x="72" y="516" width="1056" height="76" rx="7" fill="#e7eef3"/>
  <text x="105" y="564" fill="#172333" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="600">验收：质量 · 返工时间 · 耗时 · 费用</text>
  <text x="1088" y="564" text-anchor="end" fill="#536172" font-family="Microsoft YaHei, sans-serif" font-size="19">由任务决定模型去留</text>
</svg>

