<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-label="内网客户数据与外部模型调用的边界">
  <rect width="1200" height="530" fill="#f7f9f8"/>
  <text x="64" y="80" fill="#17212b" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700">架构选型先划数据边界</text>
  <text x="64" y="120" fill="#56646e" font-family="Microsoft YaHei, sans-serif" font-size="19">模型名称、网关入口和数据驻留是三个不同问题。</text>
  <rect x="64" y="169" width="540" height="282" rx="8" fill="#ffffff" stroke="#147d76" stroke-width="3"/>
  <text x="94" y="216" fill="#12645e" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700">内网</text>
  <text x="94" y="262" fill="#17212b" font-family="Microsoft YaHei, sans-serif" font-size="22">客户数据、微调样本、审计记录</text>
  <text x="94" y="309" fill="#17212b" font-family="Microsoft YaHei, sans-serif" font-size="22">本地推理需要可用权重与许可</text>
  <text x="94" y="356" fill="#17212b" font-family="Microsoft YaHei, sans-serif" font-size="22">硬件、部署、更新自行承担</text>
  <line x1="640" y1="169" x2="640" y2="451" stroke="#d33e33" stroke-width="4" stroke-dasharray="12 10"/>
  <text x="640" y="492" text-anchor="middle" fill="#a7352c" font-family="Microsoft YaHei, sans-serif" font-size="18">禁止客户数据越过此线</text>
  <rect x="718" y="169" width="418" height="282" rx="8" fill="#ffffff" stroke="#c65d45" stroke-width="3"/>
  <text x="748" y="216" fill="#a8422e" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700">外部服务</text>
  <text x="748" y="262" fill="#17212b" font-family="Microsoft YaHei, sans-serif" font-size="22">Crazyrouter 模型接口</text>
  <text x="748" y="309" fill="#17212b" font-family="Microsoft YaHei, sans-serif" font-size="22">上游模型 API</text>
  <text x="748" y="356" fill="#17212b" font-family="Microsoft YaHei, sans-serif" font-size="22">适合允许出网的独立任务</text>
</svg>